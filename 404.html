<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Redirecting…</title>
<style>body{background:#0d0d0d;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}a{color:#F5A623}</style>
<script>
  (function(){
    var path = location.pathname.toLowerCase();
    var s = location.search;
    var paid = /razorpay|payment_id|pay_/i.test(s) || /success|thank|paid|payment|confirm|welcome|registered/.test(path);
    location.replace((paid ? '/success.html' : '/') + s);
  })();
</script></head>
<body><p>Taking you to the right page… <a href="/">Click here if nothing happens</a></p></body></html>
